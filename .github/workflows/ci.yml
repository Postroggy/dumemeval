name: CI

on:
  push:
    # 仓库默认分支是 master；同时听 main 以防未来迁移默认分支
    branches: [master, main]
  pull_request:

permissions:
  # 最小权限：测试只读代码，无需写
  contents: read

concurrency:
  # 同一 ref（PR 或分支）的新 push 取消旧 run，避免排队浪费
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      # 命令以 Makefile 的 `ci` 目标为准，勿在此重复写 ruff/mypy/pytest/smoke
      - name: CI gate
        run: make ci
