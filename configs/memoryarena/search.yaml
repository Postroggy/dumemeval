# Pinned managed runtime for issue #4. See README.md for preparation and required assets.
experiment:
  name: memoryarena-search-${MEMORYARENA_ARM:-on}
  protocol: ${MEMORYARENA_PROTOCOL:-memory_session_transfer}
agent:
  runtime: claude-code
  version: ${MEMORYARENA_AGENT_VERSION:-2.1.89}
  model: ${MEMORYARENA_AGENT_MODEL}
memory:
  name: memoryarena-${MEMORYARENA_ARM:-on}
  type: ${MEMORYARENA_MEMORY_TYPE:-directory}
  path: results/memoryarena/search/${MEMORYARENA_ARM:-on}/persistent
task:
  benchmark: memoryarena_search
  memory_instruction: proactive
  task_environment:
    type: memoryarena
    config:
      reference: ${MEMORYARENA_REFERENCE:-.cache/memoryarena}
      python: "${MEMORYARENA_PYTHON:-}"
      env_name: browsecomp-plus
      seed: 37
      service_env:
        HF_HUB_CACHE: ${MEMORYARENA_TOKENIZER_CACHE:-.cache/memoryarena-assets/search-tokenizer-cache/hub}
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
        ANTHROPIC_API_KEY: ${ANTHROPIC_AUTH_TOKEN}
        ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      tools_config:
        tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
        searcher_type: openai
        provider: openai
        snippet_max_tokens: 512
        k: 5
        searcher_args:
          index_path: ${MEMORYARENA_SEARCH_INDEX:-.cache/memoryarena-search/shard*.index}
          id_map_path: ${MEMORYARENA_SEARCH_IDS:-.cache/memoryarena-search/shard*_id_map.json}
          corpus_path: ${MEMORYARENA_SEARCH_CORPUS:-.cache/memoryarena-search/corpus.jsonl}
          openai_model: ${MEMORYARENA_EMBEDDING_MODEL:-text-embedding-ada-002}
  benchmark_options:
    subset: 1
  data:
    type: hf
    dataset: ZexueHe/memoryarena
    config: progressive_search
    split: test
    revision: da1a37c8b19280e18627ca01cf368195a5e1d92e
  sessions:
    - instruction: Generated by the scenario adapter.
      placeholder: true
judging:
  type: llm_judge
  model: ${MEMORYARENA_JUDGE_MODEL}
  base_url: ${ANTHROPIC_BASE_URL}
  api_key_env: ANTHROPIC_AUTH_TOKEN
  temperature: 0
execution:
  engine: harbor
  n_concurrent: 1
  resume: false
  environment:
    type: docker
    env:
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      CLAUDE_CONFIG_DIR: /tmp/dumemeval-claude
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      ANTHROPIC_MODEL: ${MEMORYARENA_AGENT_MODEL}
output:
  dir: results/memoryarena/search/${MEMORYARENA_ARM:-on}
  tasks_dir: tasks_generated/memoryarena/search/${MEMORYARENA_ARM:-on}
