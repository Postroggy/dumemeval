# Minimal diagnostic: one Math source row, first two questions. See the CLIProxyAPI guide.
agent:
  model: gpt-5.5(medium)
  runtime: claude-code
  version: 2.1.89
execution:
  engine: harbor
  environment:
    env:
      ANTHROPIC_AUTH_TOKEN: ${DUMEMEVAL_PROXY_KEY}
      ANTHROPIC_BASE_URL: http://host.docker.internal:8317
      ANTHROPIC_MODEL: gpt-5.5(medium)
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: '1'
      CLAUDE_CONFIG_DIR: /tmp/dumemeval-claude
      ANTHROPIC_DEFAULT_HAIKU_MODEL: gpt-5.5(medium)
      ANTHROPIC_DEFAULT_SONNET_MODEL: gpt-5.5(medium)
      ANTHROPIC_DEFAULT_OPUS_MODEL: gpt-5.5(medium)
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    type: docker
    docker_image: ${MEMORYARENA_SMOKE_IMAGE:-dumemeval-claude:2.1.89-smoke-20260915}
    force_build: false
    agent_timeout_sec: 300
  n_concurrent: 1
  resume: false
experiment:
  name: memoryarena-math-cliproxy-smoke
  protocol: memory_session_transfer
judging:
  api_key_env: DUMEMEVAL_PROXY_KEY
  base_url: http://127.0.0.1:8317/v1
  model: gpt-5.5(medium)
  temperature: 0
  type: llm_judge
memory:
  name: memoryarena-on
  type: directory
  path: results/memoryarena/${MEMORYARENA_SMOKE_RUN:-cliproxy-smoke}/persistent
output:
  dir: results/memoryarena/${MEMORYARENA_SMOKE_RUN:-cliproxy-smoke}
  tasks_dir: tasks_generated/memoryarena/${MEMORYARENA_SMOKE_RUN:-cliproxy-smoke}
task:
  benchmark: memoryarena_math
  benchmark_options:
    subset: 1
    max_questions: 2
  data:
    config: formal_reasoning_math
    dataset: ZexueHe/memoryarena
    revision: da1a37c8b19280e18627ca01cf368195a5e1d92e
    split: test
    type: hf
  memory_instruction: proactive
  sessions:
  - instruction: Generated by the scenario adapter.
    placeholder: true
  task_environment:
    config:
      env_config:
        backend: openai
        max_tokens: 4096
        model_name: gpt-5.5(medium)
        temperature: 0
      env_name: math
      python: ${MEMORYARENA_PYTHON:-}
      reference: ${MEMORYARENA_REFERENCE:-.cache/memoryarena}
      seed: 37
      service_env:
        OPENAI_API_KEY: ${DUMEMEVAL_PROXY_KEY}
        OPENAI_BASE_URL: http://127.0.0.1:8317/v1
    type: memoryarena
