# Pinned Travel real-model on/off run. See docs/datasets/memoryarena/clean-setup.md.
experiment:
  name: memoryarena-travel-${MEMORYARENA_ARM:-on}
  protocol: ${MEMORYARENA_PROTOCOL:-memory_session_transfer}
agent:
  runtime: claude-code
  version: "2.1.89"
  model: gpt-5.5(medium)
memory:
  name: memoryarena-${MEMORYARENA_ARM:-on}
  type: ${MEMORYARENA_MEMORY_TYPE:-directory}
  path: results/memoryarena/${MEMORYARENA_TRAVEL_RUN:-travel-controlled}/${MEMORYARENA_ARM:-on}/persistent
task:
  benchmark: memoryarena_travel
  memory_instruction: proactive
  task_environment:
    type: memoryarena
    config:
      reference: ${MEMORYARENA_REFERENCE}
      python: ${MEMORYARENA_PYTHON}
      env_name: travel_planner
      seed: 37
      service_env:
        ANTHROPIC_API_KEY: ${DUMEMEVAL_PROXY_KEY}
        ANTHROPIC_BASE_URL: http://127.0.0.1:8317
      tools_config:
        database: ${MEMORYARENA_TRAVEL_DATABASE}
  benchmark_options:
    subset: 1
  data:
    type: hf
    dataset: ZexueHe/memoryarena
    config: group_travel_planner
    split: test
    revision: da1a37c8b19280e18627ca01cf368195a5e1d92e
  sessions:
    - instruction: Generated by the scenario adapter.
      placeholder: true
judging:
  type: llm_judge
  model: gpt-5.5(medium)
  base_url: http://127.0.0.1:8317/v1
  api_key_env: DUMEMEVAL_PROXY_KEY
  temperature: 0
execution:
  engine: harbor
  n_concurrent: 1
  resume: false
  environment:
    type: docker
    env:
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      CLAUDE_CONFIG_DIR: /tmp/dumemeval-claude
      ANTHROPIC_AUTH_TOKEN: ${DUMEMEVAL_PROXY_KEY}
      ANTHROPIC_BASE_URL: http://host.docker.internal:8317
      ANTHROPIC_MODEL: gpt-5.5(medium)
      ANTHROPIC_DEFAULT_HAIKU_MODEL: gpt-5.5(medium)
      ANTHROPIC_DEFAULT_SONNET_MODEL: gpt-5.5(medium)
      ANTHROPIC_DEFAULT_OPUS_MODEL: gpt-5.5(medium)
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    docker_image: ${MEMORYARENA_CONTROL_IMAGE}
    force_build: false
    agent_timeout_sec: 900
output:
  dir: results/memoryarena/${MEMORYARENA_TRAVEL_RUN:-travel-controlled}/${MEMORYARENA_ARM:-on}
  tasks_dir: tasks_generated/memoryarena/${MEMORYARENA_TRAVEL_RUN:-travel-controlled}/${MEMORYARENA_ARM:-on}
