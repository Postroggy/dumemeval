# Complete two-round official sample; both arms use the same prompts and image-bundled skill.
agent:
  model: gpt-5.5(medium)
  runtime: claude-code
  version: 2.1.89
execution:
  engine: harbor
  environment:
    env:
      ANTHROPIC_AUTH_TOKEN: ${DUMEMEVAL_PROXY_KEY}
      ANTHROPIC_BASE_URL: http://host.docker.internal:8317
      ANTHROPIC_MODEL: gpt-5.5(medium)
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: '1'
      CLAUDE_CONFIG_DIR: /tmp/dumemeval-claude
      ANTHROPIC_DEFAULT_HAIKU_MODEL: gpt-5.5(medium)
      ANTHROPIC_DEFAULT_SONNET_MODEL: gpt-5.5(medium)
      ANTHROPIC_DEFAULT_OPUS_MODEL: gpt-5.5(medium)
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    type: docker
    docker_image: ${MEMORYARENA_CONTROL_IMAGE:-dumemeval-claude:2.1.89-control-v2-20260915}
    force_build: false
    agent_timeout_sec: 600
  n_concurrent: 1
  resume: false
experiment:
  name: memoryarena-math-controlled-${MEMORYARENA_ARM:-on}
  protocol: ${MEMORYARENA_PROTOCOL:-memory_session_transfer}
judging:
  api_key_env: DUMEMEVAL_PROXY_KEY
  base_url: http://127.0.0.1:8317/v1
  model: gpt-5.5(medium)
  temperature: 0
  type: llm_judge
memory:
  name: memoryarena-${MEMORYARENA_ARM:-on}
  type: ${MEMORYARENA_MEMORY_TYPE:-directory}
  path: results/memoryarena/${MEMORYARENA_CONTROL_RUN:-controlled}/persistent-${MEMORYARENA_ARM:-on}
output:
  dir: results/memoryarena/${MEMORYARENA_CONTROL_RUN:-controlled}/${MEMORYARENA_ARM:-on}
  tasks_dir: tasks_generated/memoryarena/${MEMORYARENA_CONTROL_RUN:-controlled}/${MEMORYARENA_ARM:-on}
task:
  benchmark: memoryarena_math
  benchmark_options:
    subset: 1
  data:
    type: local
    path: ${MEMORYARENA_CONTROL_SAMPLE:-.cache/memoryarena-control/math-complete.json}
  memory_instruction: none
  sessions:
  - instruction: Generated by the scenario adapter.
    placeholder: true
  task_environment:
    config:
      env_config:
        backend: openai
        max_tokens: 4096
        model_name: gpt-5.5(medium)
        temperature: 0
      env_name: math
      python: ${MEMORYARENA_PYTHON:-}
      reference: ${MEMORYARENA_REFERENCE:-.cache/memoryarena}
      seed: 37
      service_env:
        OPENAI_API_KEY: ${DUMEMEVAL_PROXY_KEY}
        OPENAI_BASE_URL: http://127.0.0.1:8317/v1
      timeout_sec: 300
    type: memoryarena
