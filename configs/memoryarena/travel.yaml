# Pinned managed runtime for issue #4. See README.md for preparation and required assets.
experiment:
  name: memoryarena-travel-${MEMORYARENA_ARM:-on}
  protocol: ${MEMORYARENA_PROTOCOL:-memory_session_transfer}
agent:
  runtime: claude-code
  version: ${MEMORYARENA_AGENT_VERSION:-2.1.89}
  model: ${MEMORYARENA_AGENT_MODEL}
memory:
  name: memoryarena-${MEMORYARENA_ARM:-on}
  type: ${MEMORYARENA_MEMORY_TYPE:-directory}
  path: results/memoryarena/travel/${MEMORYARENA_ARM:-on}/persistent
task:
  benchmark: memoryarena_travel
  memory_instruction: proactive
  task_environment:
    type: memoryarena
    config:
      reference: ${MEMORYARENA_REFERENCE:-.cache/memoryarena}
      python: "${MEMORYARENA_PYTHON:-}"
      env_name: travel_planner
      seed: 37
      service_env:
        ANTHROPIC_API_KEY: ${ANTHROPIC_AUTH_TOKEN}
        ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      tools_config:
        database: ${MEMORYARENA_TRAVEL_DATABASE:-}
  benchmark_options:
    subset: 1
  data:
    type: hf
    dataset: ZexueHe/memoryarena
    config: group_travel_planner
    split: test
    revision: da1a37c8b19280e18627ca01cf368195a5e1d92e
  sessions:
    - instruction: Generated by the scenario adapter.
      placeholder: true
judging:
  type: llm_judge
  model: ${MEMORYARENA_JUDGE_MODEL}
  base_url: ${ANTHROPIC_BASE_URL}
  api_key_env: ANTHROPIC_AUTH_TOKEN
  temperature: 0
execution:
  engine: harbor
  n_concurrent: 1
  resume: false
  environment:
    type: docker
    env:
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      CLAUDE_CONFIG_DIR: /tmp/dumemeval-claude
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      ANTHROPIC_MODEL: ${MEMORYARENA_AGENT_MODEL}
output:
  dir: results/memoryarena/travel/${MEMORYARENA_ARM:-on}
  tasks_dir: tasks_generated/memoryarena/travel/${MEMORYARENA_ARM:-on}
