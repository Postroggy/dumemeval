# Same complete Math row and matching prompts as controlled-math.yaml.
# Run through hermes_repro.py for the documented Harbor 0.22 compatibility.
agent:
  model: openai/gpt-5.5(medium)
  runtime: hermes
  version: 0.21.3
  setup_timeout_sec: 120
execution:
  engine: harbor
  environment:
    type: docker
    docker_image: ${MEMORYARENA_HERMES_IMAGE:-dumemeval-hermes:0.21.3-repro}
    force_build: false
    agent_timeout_sec: 600
    env:
      OPENAI_API_KEY: ${DUMEMEVAL_PROXY_KEY}
      OPENAI_BASE_URL: http://host.docker.internal:8317/v1
      HERMES_HOME: /tmp/hermes
      TERMINAL_ENV: local
      HERMES_DISABLE_LAZY_INSTALLS: '1'
  n_concurrent: 1
  resume: false
experiment:
  name: memoryarena-math-hermes-${MEMORYARENA_ARM:-on}
  protocol: ${MEMORYARENA_PROTOCOL:-memory_session_transfer}
judging:
  api_key_env: DUMEMEVAL_PROXY_KEY
  base_url: http://127.0.0.1:8317/v1
  model: gpt-5.5(medium)
  temperature: 0
  type: llm_judge
memory:
  name: memoryarena-hermes-${MEMORYARENA_ARM:-on}
  type: ${MEMORYARENA_MEMORY_TYPE:-directory}
  path: results/memoryarena/${MEMORYARENA_CONTROL_RUN:-hermes-controlled}/persistent-${MEMORYARENA_ARM:-on}
output:
  dir: results/memoryarena/${MEMORYARENA_CONTROL_RUN:-hermes-controlled}/${MEMORYARENA_ARM:-on}
  tasks_dir: tasks_generated/memoryarena/${MEMORYARENA_CONTROL_RUN:-hermes-controlled}/${MEMORYARENA_ARM:-on}
task:
  benchmark: memoryarena_math
  benchmark_options:
    subset: 1
  data:
    type: local
    path: ${MEMORYARENA_CONTROL_SAMPLE:-.cache/memoryarena-repro/assets/math-complete-sample.json}
  memory_instruction: none
  sessions:
    - instruction: Generated by the scenario adapter.
      placeholder: true
  task_environment:
    type: memoryarena
    config:
      env_name: math
      python: ${MEMORYARENA_PYTHON:-}
      reference: ${MEMORYARENA_REFERENCE:-.cache/memoryarena}
      seed: 37
      env_config:
        backend: openai
        max_tokens: 4096
        model_name: gpt-5.5(medium)
        temperature: 0
      service_env:
        OPENAI_API_KEY: ${DUMEMEVAL_PROXY_KEY}
        OPENAI_BASE_URL: http://127.0.0.1:8317/v1
      timeout_sec: 300
