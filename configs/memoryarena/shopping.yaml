# Pinned managed runtime for issue #4. See README.md for preparation and required assets.
experiment:
  name: memoryarena-shopping-${MEMORYARENA_ARM:-on}
  protocol: ${MEMORYARENA_PROTOCOL:-memory_session_transfer}
agent:
  runtime: claude-code
  version: ${MEMORYARENA_AGENT_VERSION:-2.1.89}
  model: ${MEMORYARENA_AGENT_MODEL}
memory:
  name: memoryarena-${MEMORYARENA_ARM:-on}
  type: ${MEMORYARENA_MEMORY_TYPE:-directory}
  path: results/memoryarena/shopping/${MEMORYARENA_ARM:-on}/persistent
task:
  benchmark: memoryarena_shopping
  memory_instruction: proactive
  benchmark_options:
    subset: 1
  data:
    type: hf
    dataset: ZexueHe/memoryarena
    config: bundled_shopping
    split: test
    revision: da1a37c8b19280e18627ca01cf368195a5e1d92e
  task_environment:
    type: memoryarena
    config:
      reference: ${MEMORYARENA_REFERENCE:-.cache/memoryarena}
      python: "${MEMORYARENA_PYTHON:-}"
      env_name: webshop
      seed: 37
      timeout_sec: 600
      startup_timeout_sec: 600
      service_env:
        JAVA_HOME: ${MEMORYARENA_JAVA_HOME}
        JAVA_TOOL_OPTIONS: "-Xmx1024m -Dfile.encoding=UTF-8"
        MEMORYARENA_WEBSHOP_DATA_ROOT: ${MEMORYARENA_PRODUCT_DATA:-.cache/memoryarena-products}
        MEMORYARENA_WEBSHOP_ITEMS_FILE: ${MEMORYARENA_PRODUCT_DATA:-.cache/memoryarena-products}/items_shuffle.json
        MEMORYARENA_WEBSHOP_SEARCH_ROOT: ${MEMORYARENA_PRODUCT_DATA:-.cache/memoryarena-products}/search_engine
      env_config:
        product_catalog_dir: ${MEMORYARENA_PRODUCT_DATA:-.cache/memoryarena-products}/product_catalog
        domain_data_path: ${MEMORYARENA_PRODUCT_DATA:-.cache/memoryarena-products}/domain_data.json
  sessions:
    - instruction: Generated by the scenario adapter.
      placeholder: true
judging:
  type: llm_judge
  model: ${MEMORYARENA_JUDGE_MODEL}
  base_url: ${ANTHROPIC_BASE_URL}
  api_key_env: ANTHROPIC_AUTH_TOKEN
  temperature: 0
execution:
  engine: harbor
  n_concurrent: 1
  resume: false
  environment:
    type: docker
    env:
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      CLAUDE_CONFIG_DIR: /tmp/dumemeval-claude
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      ANTHROPIC_MODEL: ${MEMORYARENA_AGENT_MODEL}
output:
  dir: results/memoryarena/shopping/${MEMORYARENA_ARM:-on}
  tasks_dir: tasks_generated/memoryarena/shopping/${MEMORYARENA_ARM:-on}
